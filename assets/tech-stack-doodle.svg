    <rect x="51" y="44" width="7" height="6" class="f-pink" />
    <rect x="60" y="44" width="7" height="6" class="f-fuchsia" />
    <rect x="51" y="36" width="7" height="6" class="f-light" />
    <path d="M 33 54 C 36 68, 70 70, 80 58 C 84 54, 88 56, 88 56 C 84 50, 78 50, 75 52" class="s-bold" />
  </g>

  <!-- 24. Antigravity / Orbit Vortex -->
  <g class="anim-3" transform="translate(700, 415)">
    <rect width="115" height="110" class="tile" />
    <circle cx="57.5" cy="55" r="42" fill="url(#tileGlow)" />
    <!-- Doodled Gravity Vortex -->
