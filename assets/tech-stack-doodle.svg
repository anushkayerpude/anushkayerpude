<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" width="100%" height="100%" fill="none">
  <defs>
    <!-- Dark Magenta Background Gradient -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140718" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#1B0A20" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0E0412" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C0F32" />
      <stop offset="100%" stop-color="#1A081E" />
    </linearGradient>

    <radialGradient id="tileGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FF2A85" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF2A85" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="mag1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="100%" stop-color="#FF66B2" />
    </linearGradient>

    <linearGradient id="mag2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF66B2" />
      <stop offset="100%" stop-color="#E879F9" />
    </linearGradient>
  </defs>

  <style>
    .tile {
      fill: url(#tileBg);
      stroke: #831843;
      stroke-width: 1.8;
      rx: 18px;
      transition: all 0.3s ease;
    }
    .tile:hover {
      stroke: #FF2A85;
      fill: #3E1345;
      filter: drop-shadow(0 0 10px #FF2A85);
    }
    .s-bold {
      stroke: #FF2A85;
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .s-pink {
      stroke: #FF66B2;
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .s-fuchsia {
      stroke: #D946EF;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .f-pink { fill: #FF66B2; }
    .f-mag { fill: #FF2A85; }
    .f-fuchsia { fill: #D946EF; }
    .f-light { fill: #FDA4AF; }

    .anim-1 { animation: float1 3.8s ease-in-out infinite alternate; }
    .anim-2 { animation: float1 4.2s ease-in-out infinite alternate 0.6s; }
    .anim-3 { animation: float1 4.6s ease-in-out infinite alternate 1.2s; }
    @keyframes float1 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-3.5px); }
    }
  </style>

  <!-- Main Canvas Frame -->
  <rect width="840" height="540" rx="22" fill="url(#canvasBg)" stroke="#4A0F30" stroke-width="2" />

  <!-- ==================== ROW 1 (6 Large Tiles: x=25, 160, 295, 430, 565, 700; y=25) ==================== -->

  <!-- 1. Python (Snakes) -->
  <g class="anim-1" transform="translate(25, 25)">
    <rect width="115" height="110" class="tile" />
    <circle cx="57.5" cy="55" r="42" fill="url(#tileGlow)" />
    <!-- Doodled Python dual interlocking snakes -->
    <path d="M 52 28 C 38 28, 32 36, 32 44 C 32 54, 42 54, 56 54 L 64 54 C 74 54, 80 58, 80 68 C 80 78, 68 78, 58 78" class="s-bold" />
    <path d="M 63 78 C 77 78, 83 70, 83 62 C 83 52, 73 52, 59 52 L 51 52 C 41 52, 35 48, 35 38 C 35 28, 47 28, 57 28" class="s-pink" />
    <circle cx="45" cy="36" r="3.2" class="f-pink" />
    <circle cx="70" cy="70" r="3.2" class="f-mag" />
  </g>

  <!-- 2. React (Atom Orbits) -->
  <g class="anim-2" transform="translate(160, 25)">
    <rect width="115" height="110" class="tile" />
    <circle cx="57.5" cy="55" r="42" fill="url(#tileGlow)" />
    <!-- Doodled Atom Rings -->
    <ellipse cx="57.5" cy="55" rx="36" ry="12" class="s-bold" />
    <ellipse cx="57.5" cy="55" rx="36" ry="12" class="s-pink" transform="rotate(60 57.5 55)" />
    <ellipse cx="57.5" cy="55" rx="36" ry="12" class="s-fuchsia" transform="rotate(120 57.5 55)" />
    <circle cx="57.5" cy="55" r="6" class="f-pink" />
  </g>

  <!-- 3. Next.js (Speed Chevron Circle) -->
  <g class="anim-3" transform="translate(295, 25)">
    <rect width="115" height="110" class="tile" />
    <circle cx="57.5" cy="55" r="42" fill="url(#tileGlow)" />
    <!-- Next.js Stylized Circle & Speed Stroke -->
    <circle cx="57.5" cy="55" r="32" class="s-bold" stroke-dasharray="200, 4" />
    <path d="M 44 38 L 44 72 M 44 40 L 68 72 M 68 38 L 68 58" class="s-pink" stroke-width="3.6" />
  </g>

  <!-- 4. Node.js (Hexagonal Crystal Branch) -->
  <g class="anim-1" transform="translate(430, 25)">
    <rect width="115" height="110" class="tile" />
    <circle cx="57.5" cy="55" r="42" fill="url(#tileGlow)" />
    <!-- Doodled Hexagon Crystal with Tree Nodes -->
    <polygon points="57.5,24 88,41 88,71 57.5,88 27,71 27,41" class="s-pink" />
    <path d="M 57.5,38 L 57.5,60 M 57.5,50 L 42,58 M 57.5,50 L 73,58" class="s-bold" />
    <circle cx="57.5" cy="38" r="3.5" class="f-fuchsia" />
    <circle cx="42" cy="58" r="3.5" class="f-mag" />
    <circle cx="73" cy="58" r="3.5" class="f-mag" />
  </g>

  <!-- 5. Code Brackets / Logic (C++ / Script) -->
  <g class="anim-2" transform="translate(565, 25)">
    <rect width="115" height="110" class="tile" />
    <circle cx="57.5" cy="55" r="42" fill="url(#tileGlow)" />
    <!-- Doodled Curly Braces + Lightning -->
    <path d="M 42 34 C 32 34, 30 46, 30 52 C 30 58, 22 55, 22 55 C 22 55, 30 52, 30 58 C 30 64, 32 76, 42 76" class="s-bold" />
    <path d="M 73 34 C 83 34, 85 46, 85 52 C 85 58, 93 55, 93 55 C 93 55, 85 52, 85 58 C 85 64, 83 76, 73 76" class="s-bold" />
    <path d="M 60 38 L 50 54 L 62 54 L 54 72" class="s-pink" stroke-width="2.6" />
  </g>

  <!-- 6. Figma (5-Bubble Layout) -->
  <g class="anim-3" transform="translate(700, 25)">
    <rect width="115" height="110" class="tile" />
    <circle cx="57.5" cy="55" r="42" fill="url(#tileGlow)" />
    <!-- Doodled 5-Ring Layout -->
    <circle cx="47" cy="40" r="10" class="s-bold" />
    <circle cx="68" cy="40" r="10" class="s-pink" />
    <circle cx="47" cy="58" r="10" class="s-fuchsia" />
    <circle cx="68" cy="58" r="10" class="s-pink" />
    <circle cx="47" cy="76" r="10" class="s-bold" />
  </g>


  <!-- ==================== ROW 2 (6 Large Tiles: y=155) ==================== -->

  <!-- 7. PyTorch (Flame Torch) -->
  <g class="anim-2" transform="translate(25, 155)">
    <rect width="115" height="110" class="tile" />
    <circle cx="57.5" cy="55" r="42" fill="url(#tileGlow)" />
    <!-- Doodled Flaming Torch Flame -->
    <path d="M 57.5 24 C 74 38, 70 62, 60 70 C 52 76, 38 72, 36 62 C 34 50, 48 44, 57.5 24 Z" class="s-bold" />
    <circle cx="72" cy="32" r="4" class="f-pink" />
    <path d="M 55 52 C 60 58, 58 64, 52 66" class="s-fuchsia" stroke-width="2.2" />
  </g>

  <!-- 8. OpenCV (3-Aperture Triangle) -->
  <g class="anim-3" transform="translate(160, 155)">
    <rect width="115" height="110" class="tile" />
    <circle cx="57.5" cy="55" r="42" fill="url(#tileGlow)" />
    <!-- Doodled 3-Ring Circular Geometry -->
    <circle cx="57.5" cy="42" r="13" class="s-bold" />
    <circle cx="43" cy="67" r="13" class="s-pink" />
    <circle cx="72" cy="67" r="13" class="s-fuchsia" />
    <circle cx="57.5" cy="58" r="4" class="f-light" />
  </g>

  <!-- 9. TensorFlow / Neural Mesh (3D Cube) -->
  <g class="anim-1" transform="translate(295, 155)">
    <rect width="115" height="110" class="tile" />
    <circle cx="57.5" cy="55" r="42" fill="url(#tileGlow)" />
    <!-- Doodled Isometric Neural Cube -->
    <polygon points="57.5,24 88,40 88,72 57.5,88 27,72 27,40" class="s-pink" />
    <line x1="57.5" y1="24" x2="57.5" y2="88" class="s-bold" />
    <line x1="27" y1="40" x2="57.5" y2="56" class="s-bold" />
    <line x1="88" y1="40" x2="57.5" y2="56" class="s-bold" />
    <circle cx="57.5" cy="56" r="4.5" class="f-mag" />
  </g>

  <!-- 10. Computer Vision (Lens & Pupil) -->
  <g class="anim-2" transform="translate(430, 155)">
    <rect width="115" height="110" class="tile" />
    <circle cx="57.5" cy="55" r="42" fill="url(#tileGlow)" />
    <!-- Doodled Optical Iris Contour -->
    <path d="M 27 55 C 40 35, 75 35, 88 55 C 75 75, 40 75, 27 55 Z" class="s-bold" />
    <circle cx="57.5" cy="55" r="14" class="s-pink" />
    <circle cx="57.5" cy="55" r="6" class="f-fuchsia" />
    <circle cx="61" cy="51" r="2.5" fill="#FFF" />
  </g>

  <!-- 11. ROS / Robotics (Antenna Robot Head) -->
  <g class="anim-3" transform="translate(565, 155)">
    <rect width="115" height="110" class="tile" />
    <circle cx="57.5" cy="55" r="42" fill="url(#tileGlow)" />
    <!-- Doodled Cute Robot Head -->
    <line x1="57.5" y1="23" x2="57.5" y2="35" class="s-bold" />
    <circle cx="57.5" cy="23" r="3.5" class="f-pink" />
    <rect x="33" y="35" width="49" height="38" rx="10" class="s-pink" />
    <circle cx="47" cy="50" r="4.5" class="f-mag" />
    <circle cx="68" cy="50" r="4.5" class="f-mag" />
    <line x1="45" y1="63" x2="70" y2="63" class="s-fuchsia" stroke-width="2.4" />
  </g>

  <!-- 12. Gazebo (Physics Vehicle / Bot) -->
  <g class="anim-1" transform="translate(700, 155)">
    <rect width="115" height="110" class="tile" />
    <circle cx="57.5" cy="55" r="42" fill="url(#tileGlow)" />
    <!-- Doodled Simulation Rover Chassis -->
    <path d="M 33 52 L 57.5,30 L 82 52 Z" class="s-bold" />
    <line x1="41" y1="52" x2="41" y2="70" class="s-pink" />
    <line x1="74" y1="52" x2="74" y2="70" class="s-pink" />
    <circle cx="41" cy="74" r="5.5" class="f-fuchsia" />
    <circle cx="74" cy="74" r="5.5" class="f-fuchsia" />
    <line x1="33" y1="61" x2="82" y2="61" class="s-bold" />
  </g>


  <!-- ==================== ROW 3 (6 Large Tiles: y=285) ==================== -->

  <!-- 13. SLAM (Radar Sensor Wave Arcs) -->
  <g class="anim-3" transform="translate(25, 285)">
    <rect width="115" height="110" class="tile" />
    <circle cx="57.5" cy="55" r="42" fill="url(#tileGlow)" />
    <!-- Doodled Sensor Sweep -->
    <circle cx="57.5" cy="72" r="5" class="f-mag" />
    <path d="M 43 60 A 20 20 0 0 1 72 60" class="s-pink" />
    <path d="M 32 48 A 33 33 0 0 1 83 48" class="s-bold" />
    <path d="M 23 36 A 46 46 0 0 1 92 36" class="s-fuchsia" />
    <line x1="57.5" y1="72" x2="76" y2="40" class="s-bold" stroke-dasharray="4,4" />
  </g>

  <!-- 14. GIS / Geospatial (Globe with Marker) -->
  <g class="anim-1" transform="translate(160, 285)">
    <rect width="115" height="110" class="tile" />
    <circle cx="57.5" cy="55" r="42" fill="url(#tileGlow)" />
    <!-- Doodled Globe & Coordinate Pin -->
    <circle cx="57.5" cy="55" r="28" class="s-fuchsia" />
    <ellipse cx="57.5" cy="55" rx="13" ry="28" class="s-pink" />
    <line x1="29.5" y1="55" x2="85.5" y2="55" class="s-bold" />
    <circle cx="66" cy="42" r="4.5" class="f-mag" />
  </g>

  <!-- 15. Game Dev (Retro Gamepad) -->
  <g class="anim-2" transform="translate(295, 285)">
    <rect width="115" height="110" class="tile" />
    <circle cx="57.5" cy="55" r="42" fill="url(#tileGlow)" />
    <!-- Doodled Gamepad -->
    <rect x="28" y="38" width="59" height="34" rx="10" class="s-bold" />
    <!-- D-pad -->
    <path d="M 42 48 L 42 62 M 35 55 L 49 55" class="s-pink" stroke-width="2.6" />
    <!-- Action buttons -->
    <circle cx="70" cy="50" r="3" class="f-fuchsia" />
    <circle cx="76" cy="58" r="3" class="f-pink" />
  </g>

  <!-- 16. TailwindCSS (Wind Waves) -->
  <g class="anim-3" transform="translate(430, 285)">
    <rect width="115" height="110" class="tile" />
    <circle cx="57.5" cy="55" r="42" fill="url(#tileGlow)" />
    <!-- Doodled Oceanic Wind Waves -->
    <path d="M 33 58 C 38 42, 51 40, 58 52 C 63 60, 71 60, 81 50" class="s-bold" stroke-width="3.5" />
    <path d="M 43 68 C 47 56, 56 54, 62 63 C 66 68, 71 68, 79 60" class="s-pink" stroke-width="3" />
  </g>

  <!-- 17. SQL / Database (Cylinders) -->
  <g class="anim-1" transform="translate(565, 285)">
    <rect width="115" height="110" class="tile" />
    <circle cx="57.5" cy="55" r="42" fill="url(#tileGlow)" />
    <!-- Doodled Cylindrical Storage Stacks -->
    <ellipse cx="57.5" cy="38" rx="25" ry="9" class="s-bold" />
    <path d="M 32.5 38 L 32.5 53 C 32.5 60, 82.5 60, 82.5 53 L 82.5 38" class="s-pink" />
    <path d="M 32.5 53 L 32.5 68 C 32.5 75, 82.5 75, 82.5 68 L 82.5 53" class="s-fuchsia" />
  </g>

  <!-- 18. Git (Branch Nodes) -->
  <g class="anim-2" transform="translate(700, 285)">
    <rect width="115" height="110" class="tile" />
    <circle cx="57.5" cy="55" r="42" fill="url(#tileGlow)" />
    <!-- Doodled Branch Tree -->
    <circle cx="45" cy="74" r="5" class="f-mag" />
    <circle cx="45" cy="36" r="5" class="f-mag" />
    <circle cx="70" cy="52" r="5" class="f-pink" />
    <line x1="45" y1="36" x2="45" y2="74" class="s-bold" />
    <path d="M 45 60 C 55 60, 70 58, 70 52" class="s-pink" />
  </g>


  <!-- ==================== ROW 4 (6 Large Tiles: y=415) ==================== -->

  <!-- 19. GitHub (Cat Contour) -->
  <g class="anim-1" transform="translate(25, 415)">
    <rect width="115" height="110" class="tile" />
    <circle cx="57.5" cy="55" r="42" fill="url(#tileGlow)" />
    <!-- Doodled GitHub Cat Silhouette -->
    <path d="M 37 72 C 32 60, 35 44, 57.5 44 C 80 44, 83 60, 78 72" class="s-bold" />
    <polygon points="40,50 35,32 47,42" class="f-mag" />
    <polygon points="75,50 80,32 68,42" class="f-mag" />
    <path d="M 51 60 Q 57.5 65 64 60" class="s-pink" />
  </g>

  <!-- 20. Linux (Terminal & Prompt) -->
  <g class="anim-2" transform="translate(160, 415)">
    <rect width="115" height="110" class="tile" />
    <circle cx="57.5" cy="55" r="42" fill="url(#tileGlow)" />
    <!-- Doodled Terminal Screen with Shell Cursor -->
    <rect x="30" y="34" width="55" height="42" rx="8" class="s-pink" />
    <path d="M 40 48 L 48 55 L 40 62" class="s-bold" stroke-width="2.8" />
    <line x1="53" y1="62" x2="68" y2="62" class="s-fuchsia" stroke-width="3" />
  </g>

  <!-- 21. MacOS (Apple Contour) -->
  <g class="anim-3" transform="translate(295, 415)">
    <rect width="115" height="110" class="tile" />
    <circle cx="57.5" cy="55" r="42" fill="url(#tileGlow)" />
    <!-- Doodled Apple Silhouette -->
    <path d="M 57.5 38 C 53 30, 61 25, 61 25 C 61 25, 66 30, 60 38" class="s-pink" stroke-width="2.6" />
    <path d="M 57.5 41 C 52 37, 41 38, 38 48 C 34 60, 43 78, 57.5 78 C 72 78, 81 60, 77 48 C 74 38, 63 37, 57.5 41 Z" class="s-bold" stroke-width="3" />
  </g>

  <!-- 22. Calibration (Optical Crosshairs) -->
  <g class="anim-1" transform="translate(430, 415)">
    <rect width="115" height="110" class="tile" />
    <circle cx="57.5" cy="55" r="42" fill="url(#tileGlow)" />
    <!-- Doodled Target Grid & Crosshairs -->
    <rect x="35" y="32" width="45" height="45" rx="4" class="s-bold" />
    <circle cx="57.5" cy="54.5" r="14" class="s-pink" />
    <line x1="57.5" y1="26" x2="57.5" y2="83" class="s-fuchsia" stroke-width="1.8" />
    <line x1="29" y1="54.5" x2="86" y2="54.5" class="s-fuchsia" stroke-width="1.8" />
    <circle cx="57.5" cy="54.5" r="3.5" class="f-mag" />
  </g>

  <!-- 23. Docker (Container Whale) -->
  <g class="anim-2" transform="translate(565, 415)">
    <rect width="115" height="110" class="tile" />
    <circle cx="57.5" cy="55" r="42" fill="url(#tileGlow)" />
    <!-- Doodled Whale & Containers -->
