<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150B1A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0D0610" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28112E" />
      <stop offset="100%" stop-color="#18091C" />
    </linearGradient>

    <linearGradient id="magLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="50%" stop-color="#FF66B2" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>

    <radialGradient id="glowTile" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FF2A85" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF2A85" stop-opacity="0" />
    </radialGradient>

    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .tile {
      fill: url(#tileGrad);
      stroke: #831843;
      stroke-width: 1.5;
      rx: 14px;
      transition: all 0.3s ease;
    }
    .tile:hover {
      stroke: #FF2A85;
      fill: #34123D;
      filter: drop-shadow(0 0 8px #FF2A85);
    }
    .d-stroke {
      stroke: #FF2A85;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .d-stroke-pink {
      stroke: #FF66B2;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .d-stroke-fuchsia {
      stroke: #D946EF;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .d-fill {
      fill: #FF2A85;
    }
    .d-fill-pink {
      fill: #FF66B2;
    }
    .d-fill-fuchsia {
      fill: #D946EF;
    }
    .d-fill-soft {
      fill: #FDA4AF;
    }

    /* Floating subtle wiggle for doodled warmth */
    .w-1 { animation: floatAnim 4s ease-in-out infinite alternate; }
    .w-2 { animation: floatAnim 4.5s ease-in-out infinite alternate 0.5s; }
    .w-3 { animation: floatAnim 3.8s ease-in-out infinite alternate 1s; }
    .w-4 { animation: floatAnim 4.2s ease-in-out infinite alternate 1.5s; }
    @keyframes floatAnim {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-3px); }
    }
  </style>

  <!-- Background Canvas -->
  <rect width="840" height="330" rx="18" fill="url(#bgGrad)" stroke="#4A0F30" stroke-width="1.6" />

  <!-- ==================== ROW 1 (8 Icons) ==================== -->

  <!-- 1. Python -->
  <g class="w-1" transform="translate(20, 20)">
    <rect width="90" height="90" class="tile" />
    <circle cx="45" cy="45" r="32" fill="url(#glowTile)" />
    <!-- Doodled Python dual snakes -->
    <path d="M 42 26 C 32 26, 28 32, 28 38 C 28 46, 36 46, 44 46 L 50 46 C 56 46, 60 49, 60 56 C 60 64, 52 64, 46 64" class="d-stroke" />
    <path d="M 48 64 C 58 64, 62 58, 62 52 C 62 44, 54 44, 46 44 L 40 44 C 34 44, 30 41, 30 34 C 30 26, 38 26, 44 26" class="d-stroke-pink" />
    <circle cx="37" cy="32" r="2.2" class="d-fill-pink" />
    <circle cx="53" cy="58" r="2.2" class="d-fill" />
  </g>

  <!-- 2. C++ -->
  <g class="w-2" transform="translate(120, 20)">
    <rect width="90" height="90" class="tile" />
    <circle cx="45" cy="45" r="32" fill="url(#glowTile)" />
    <!-- Doodled C with ++ -->
    <path d="M 45 32 C 34 32, 26 38, 26 45 C 26 52, 34 58, 45 58" class="d-stroke" stroke-width="3.5" />
    <!-- First + -->
    <path d="M 54 40 L 54 50 M 49 45 L 59 45" class="d-stroke-pink" stroke-width="2.5" />
    <!-- Second + -->
    <path d="M 68 40 L 68 50 M 63 45 L 73 45" class="d-stroke-fuchsia" stroke-width="2.5" />
  </g>

  <!-- 3. JavaScript -->
  <g class="w-3" transform="translate(220, 20)">
    <rect width="90" height="90" class="tile" />
    <circle cx="45" cy="45" r="32" fill="url(#glowTile)" />
    <!-- Doodled JS Badge -->
    <rect x="25" y="25" width="40" height="40" rx="8" class="d-stroke-fuchsia" stroke-dasharray="140, 2" />
    <!-- J -->
    <path d="M 39 40 L 39 54 C 39 60, 31 60, 31 54" class="d-stroke-pink" />
    <!-- S -->
    <path d="M 59 42 C 54 39, 47 40, 47 45 C 47 52, 59 50, 59 56 C 59 61, 51 61, 46 58" class="d-stroke" />
  </g>

  <!-- 4. TypeScript -->
  <g class="w-4" transform="translate(320, 20)">
    <rect width="90" height="90" class="tile" />
    <circle cx="45" cy="45" r="32" fill="url(#glowTile)" />
    <!-- Doodled TS Badge -->
    <rect x="25" y="25" width="40" height="40" rx="8" class="d-stroke" stroke-dasharray="140, 2" />
    <!-- T -->
    <path d="M 32 38 L 46 38 M 39 38 L 39 58" class="d-stroke-pink" stroke-width="2.5" />
    <!-- S -->
    <path d="M 59 42 C 55 39, 49 40, 49 45 C 49 52, 59 50, 59 56 C 59 61, 52 61, 48 58" class="d-stroke-fuchsia" />
  </g>

  <!-- 5. React -->
  <g class="w-1" transform="translate(420, 20)">
    <rect width="90" height="90" class="tile" />
    <circle cx="45" cy="45" r="32" fill="url(#glowTile)" />
    <!-- Doodled Atom Ellipses -->
    <ellipse cx="45" cy="45" rx="26" ry="9" class="d-stroke" />
    <ellipse cx="45" cy="45" rx="26" ry="9" class="d-stroke-pink" transform="rotate(60 45 45)" />
    <ellipse cx="45" cy="45" rx="26" ry="9" class="d-stroke-fuchsia" transform="rotate(120 45 45)" />
    <circle cx="45" cy="45" r="4" class="d-fill-pink" />
  </g>

  <!-- 6. Next.js -->
  <g class="w-2" transform="translate(520, 20)">
    <rect width="90" height="90" class="tile" />
    <circle cx="45" cy="45" r="32" fill="url(#glowTile)" />
    <!-- Doodled Next Circle + N -->
    <circle cx="45" cy="45" r="24" class="d-stroke" stroke-dasharray="150, 3" />
    <path d="M 35 32 L 35 58 M 35 33 L 53 58 M 53 32 L 53 48" class="d-stroke-pink" stroke-width="2.6" />
  </g>

  <!-- 7. Node.js -->
  <g class="w-3" transform="translate(620, 20)">
    <rect width="90" height="90" class="tile" />
    <circle cx="45" cy="45" r="32" fill="url(#glowTile)" />
    <!-- Doodled Hexagon with Inner Branch -->
    <polygon points="45,23 68,36 68,62 45,75 22,62 22,36" class="d-stroke-pink" />
    <path d="M 45 35 L 45 52 M 45 45 L 34 50 M 45 45 L 56 50" class="d-stroke" stroke-width="2" />
    <circle cx="45" cy="35" r="2.5" class="d-fill-fuchsia" />
    <circle cx="34" cy="50" r="2.5" class="d-fill" />
    <circle cx="56" cy="50" r="2.5" class="d-fill" />
  </g>

  <!-- 8. Figma -->
  <g class="w-4" transform="translate(720, 20)">
    <rect width="90" height="90" class="tile" />
    <circle cx="45" cy="45" r="32" fill="url(#glowTile)" />
    <!-- Doodled Figma 5-bubble layout -->
    <circle cx="37" cy="34" r="8" class="d-stroke" />
    <circle cx="53" cy="34" r="8" class="d-stroke-pink" />
    <circle cx="37" cy="48" r="8" class="d-stroke-fuchsia" />
    <circle cx="53" cy="48" r="8" class="d-stroke-pink" />
    <circle cx="37" cy="62" r="8" class="d-stroke" />
  </g>

  <!-- ==================== ROW 2 (8 Icons) ==================== -->

  <!-- 9. PyTorch -->
  <g class="w-2" transform="translate(20, 120)">
    <rect width="90" height="90" class="tile" />
    <circle cx="45" cy="45" r="32" fill="url(#glowTile)" />
    <!-- Doodled Flame Torch -->
    <path d="M 45 24 C 58 35 55 52 48 58 C 42 63 32 60 30 52 C 28 42 38 38 45 24 Z" class="d-stroke" />
    <circle cx="56" cy="30" r="3" class="d-fill-pink" />
    <path d="M 43 44 C 47 48 46 54 42 56" class="d-stroke-fuchsia" stroke-width="1.8" />
  </g>

  <!-- 10. OpenCV -->
  <g class="w-3" transform="translate(120, 120)">
    <rect width="90" height="90" class="tile" />
    <circle cx="45" cy="45" r="32" fill="url(#glowTile)" />
    <!-- Doodled OpenCV 3 Intersecting Aperture Rings -->
    <circle cx="45" cy="35" r="10" class="d-stroke" />
    <circle cx="34" cy="54" r="10" class="d-stroke-pink" />
    <circle cx="56" cy="54" r="10" class="d-stroke-fuchsia" />
    <circle cx="45" cy="48" r="3" class="d-fill-soft" />
  </g>

  <!-- 11. TensorFlow -->
  <g class="w-4" transform="translate(220, 120)">
    <rect width="90" height="90" class="tile" />
    <circle cx="45" cy="45" r="32" fill="url(#glowTile)" />
    <!-- Doodled Isometric Neural Cube -->
    <path d="M 45 24 L 66 36 L 66 60 L 45 72 L 24 60 L 24 36 Z" class="d-stroke-pink" />
    <line x1="45" y1="24" x2="45" y2="72" class="d-stroke" />
    <line x1="24" y1="36" x2="45" y2="48" class="d-stroke" />
    <line x1="66" y1="36" x2="45" y2="48" class="d-stroke" />
    <circle cx="45" cy="48" r="3.5" class="d-fill" />
  </g>

  <!-- 12. Computer Vision / Camera Sensor -->
  <g class="w-1" transform="translate(320, 120)">
    <rect width="90" height="90" class="tile" />
    <circle cx="45" cy="45" r="32" fill="url(#glowTile)" />
    <!-- Doodled Vision Eye / Camera Aperture -->
    <path d="M 22 45 C 32 30, 58 30, 68 45 C 58 60, 32 60, 22 45 Z" class="d-stroke" />
    <circle cx="45" cy="45" r="10" class="d-stroke-pink" />
    <circle cx="45" cy="45" r="4.5" class="d-fill-fuchsia" />
    <circle cx="48" cy="42" r="1.8" fill="#FFF" />
  </g>

  <!-- 13. ROS / Robotics Robot -->
  <g class="w-2" transform="translate(420, 120)">
    <rect width="90" height="90" class="tile" />
    <circle cx="45" cy="45" r="32" fill="url(#glowTile)" />
    <!-- Doodled Robot Head & Antenna -->
    <line x1="45" y1="23" x2="45" y2="33" class="d-stroke" />
    <circle cx="45" cy="23" r="3" class="d-fill-pink" />
    <rect x="26" y="33" width="38" height="30" rx="8" class="d-stroke-pink" />
    <circle cx="37" cy="45" r="3.5" class="d-fill" />
    <circle cx="53" cy="45" r="3.5" class="d-fill" />
    <line x1="36" y1="55" x2="54" y2="55" class="d-stroke-fuchsia" stroke-width="1.8" />
  </g>

  <!-- 14. Gazebo Simulation -->
  <g class="w-3" transform="translate(520, 120)">
    <rect width="90" height="90" class="tile" />
    <circle cx="45" cy="45" r="32" fill="url(#glowTile)" />
    <!-- Doodled Gazebo Structure & Wheels -->
    <path d="M 26 44 L 45 26 L 64 44 Z" class="d-stroke" />
    <line x1="32" y1="44" x2="32" y2="60" class="d-stroke-pink" />
    <line x1="58" y1="44" x2="58" y2="60" class="d-stroke-pink" />
    <circle cx="32" cy="62" r="4" class="d-fill-fuchsia" />
    <circle cx="58" cy="62" r="4" class="d-fill-fuchsia" />
    <line x1="26" y1="52" x2="64" y2="52" class="d-stroke" />
  </g>

  <!-- 15. SLAM / Radar Waves -->
  <g class="w-4" transform="translate(620, 120)">
    <rect width="90" height="90" class="tile" />
    <circle cx="45" cy="45" r="32" fill="url(#glowTile)" />
    <!-- Doodled Lidar Sweep Radar Arcs -->
    <circle cx="45" cy="60" r="4" class="d-fill" />
    <path d="M 33 50 A 16 16 0 0 1 57 50" class="d-stroke-pink" />
    <path d="M 25 40 A 26 26 0 0 1 65 40" class="d-stroke" />
    <path d="M 18 30 A 36 36 0 0 1 72 30" class="d-stroke-fuchsia" />
    <line x1="45" y1="60" x2="60" y2="34" class="d-stroke" stroke-dasharray="3,3" />
  </g>

  <!-- 16. GIS / UrbanLens Spatial Globe -->
  <g class="w-1" transform="translate(720, 120)">
    <rect width="90" height="90" class="tile" />
    <circle cx="45" cy="45" r="32" fill="url(#glowTile)" />
    <!-- Doodled Globe + Location Marker -->
    <circle cx="45" cy="45" r="22" class="d-stroke-fuchsia" />
    <ellipse cx="45" cy="45" rx="10" ry="22" class="d-stroke-pink" />
    <line x1="23" y1="45" x2="67" y2="45" class="d-stroke" />
    <!-- Pin -->
    <circle cx="52" cy="34" r="3.5" class="d-fill" />
  </g>

  <!-- ==================== ROW 3 (8 Icons) ==================== -->

  <!-- 17. Game Development / Gamepad -->
  <g class="w-3" transform="translate(20, 220)">
    <rect width="90" height="90" class="tile" />
    <circle cx="45" cy="45" r="32" fill="url(#glowTile)" />
    <!-- Doodled Retro Game Controller -->
    <rect x="22" y="32" width="46" height="28" rx="8" class="d-stroke" />
    <!-- D-pad -->
    <path d="M 32 40 L 32 52 M 26 46 L 38 46" class="d-stroke-pink" stroke-width="2" />
    <!-- Buttons -->
    <circle cx="55" cy="42" r="2.2" class="d-fill-fuchsia" />
    <circle cx="60" cy="48" r="2.2" class="d-fill-pink" />
  </g>

  <!-- 18. TailwindCSS -->
  <g class="w-4" transform="translate(120, 220)">
    <rect width="90" height="90" class="tile" />
    <circle cx="45" cy="45" r="32" fill="url(#glowTile)" />
    <!-- Doodled Wave Curves -->
    <path d="M 26 48 C 30 36, 40 34, 46 44 C 50 50, 56 50, 64 42" class="d-stroke" stroke-width="2.8" />
    <path d="M 34 56 C 37 47, 44 45, 49 52 C 52 56, 56 56, 62 50" class="d-stroke-pink" stroke-width="2.4" />
  </g>

  <!-- 19. SQL / Database Cylinder -->
  <g class="w-1" transform="translate(220, 220)">
    <rect width="90" height="90" class="tile" />
    <circle cx="45" cy="45" r="32" fill="url(#glowTile)" />
    <!-- Doodled Database Stacks -->
    <ellipse cx="45" cy="33" rx="20" ry="7" class="d-stroke" />
    <path d="M 25 33 L 25 45 C 25 50, 65 50, 65 45 L 65 33" class="d-stroke-pink" />
    <path d="M 25 45 L 25 57 C 25 62, 65 62, 65 57 L 65 45" class="d-stroke-fuchsia" />
  </g>

  <!-- 20. Git Branching -->
  <g class="w-2" transform="translate(320, 220)">
    <rect width="90" height="90" class="tile" />
    <circle cx="45" cy="45" r="32" fill="url(#glowTile)" />
    <!-- Doodled Git Branches -->
    <circle cx="36" cy="60" r="4" class="d-fill" />
    <circle cx="36" cy="32" r="4" class="d-fill" />
    <circle cx="56" cy="44" r="4" class="d-fill-pink" />
    <line x1="36" y1="32" x2="36" y2="60" class="d-stroke" />
    <path d="M 36 50 C 44 50, 56 48, 56 44" class="d-stroke-pink" />
  </g>

  <!-- 21. GitHub Octocat Silhouette -->
  <g class="w-3" transform="translate(420, 220)">
    <rect width="90" height="90" class="tile" />
    <circle cx="45" cy="45" r="32" fill="url(#glowTile)" />
    <!-- Doodled Cat Head Silhouette -->
    <path d="M 30 58 C 26 48, 28 36, 45 36 C 62 36, 64 48, 60 58" class="d-stroke" />
    <polygon points="32,40 28,26 38,34" class="d-fill" />
    <polygon points="58,40 62,26 52,34" class="d-fill" />
    <path d="M 40 48 Q 45 52 50 48" class="d-stroke-pink" />
  </g>

  <!-- 22. Linux / Terminal Prompt -->
  <g class="w-4" transform="translate(520, 220)">
    <rect width="90" height="90" class="tile" />
    <circle cx="45" cy="45" r="32" fill="url(#glowTile)" />
    <!-- Doodled Terminal Screen with Prompt -->
    <rect x="24" y="28" width="42" height="34" rx="6" class="d-stroke-pink" />
    <path d="M 31 40 L 37 45 L 31 50" class="d-stroke" stroke-width="2.2" />
    <line x1="41" y1="50" x2="52" y2="50" class="d-stroke-fuchsia" stroke-width="2.5" />
  </g>

  <!-- 23. MacOS -->
  <g class="w-1" transform="translate(620, 220)">
    <rect width="90" height="90" class="tile" />
    <circle cx="45" cy="45" r="32" fill="url(#glowTile)" />
    <!-- Doodled Apple Contour -->
    <path d="M 45 34 C 42 28, 48 24, 48 24 C 48 24, 52 28, 47 34" class="d-stroke-pink" stroke-width="2" />
    <path d="M 45 36 C 41 33, 33 34, 30 42 C 27 52, 34 66, 45 66 C 56 66, 63 52, 60 42 C 57 34, 49 33, 45 36 Z" class="d-stroke" stroke-width="2.4" />
  </g>

  <!-- 24. Docker / Postman / Antigravity -->
  <g class="w-2" transform="translate(720, 220)">
    <rect width="90" height="90" class="tile" />
    <circle cx="45" cy="45" r="32" fill="url(#glowTile)" />
    <!-- Doodled Orbit Singularity / Rocket -->
    <circle cx="45" cy="45" r="18" class="d-stroke" stroke-dasharray="6,4" />
    <ellipse cx="45" cy="45" rx="26" ry="8" class="d-stroke-pink" transform="rotate(-35 45 45)" />
    <circle cx="45" cy="45" r="5" class="d-fill-fuchsia" />
    <circle cx="58" cy="36" r="2.5" class="d-fill" />
  </g>

</svg>