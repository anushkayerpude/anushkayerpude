    <ellipse cx="57.5" cy="55" rx="34" ry="11" class="s-pink" transform="rotate(-35 57.5 55)" />
    <circle cx="57.5" cy="55" r="7" class="f-fuchsia" />
    <circle cx="74" cy="44" r="3.5" class="f-mag" />
