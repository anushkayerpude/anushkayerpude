<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 165" width="290" height="126" fill="none">
  <defs>
    <!-- Lighter, softer, luminous magenta gradients -->
    <radialGradient id="chonkBodyLight" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FFA8CE" />
      <stop offset="40%" stop-color="#FF6AA8" />
      <stop offset="80%" stop-color="#D93B88" />
      <stop offset="100%" stop-color="#9C1858" />
    </radialGradient>

    <radialGradient id="chonkHeadLight" cx="40%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#FFB3D4" />
      <stop offset="45%" stop-color="#FF75B0" />
      <stop offset="82%" stop-color="#E04692" />
      <stop offset="100%" stop-color="#A81D60" />
    </radialGradient>

    <radialGradient id="cheekBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE4F0" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#FFA6CC" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FF75B0" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="earInnerLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F6" />
      <stop offset="100%" stop-color="#FF9EC5" />
    </linearGradient>

    <linearGradient id="pawLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE4F0" />
      <stop offset="55%" stop-color="#FF85BA" />
      <stop offset="100%" stop-color="#C22572" />
    </linearGradient>

    <radialGradient id="eyeIrisLight" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#FFF5FA" />
      <stop offset="35%" stop-color="#FF7BB5" />
      <stop offset="75%" stop-color="#B81862" />
      <stop offset="100%" stop-color="#5E0630" />
    </radialGradient>

    <radialGradient id="catGlowGround" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4D9B" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#D92078" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#2D0618" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    /* Chonky Squishy Breathing */
    .fat-breathe {
      transform-origin: 190px 130px;
      animation: fatBreathe 3.2s ease-in-out infinite alternate;
    }
    @keyframes fatBreathe {
      0% { transform: scale(1, 1) translateY(0px); }
      100% { transform: scale(1.045, 0.96) translateY(2px); }
    }

    /* Head gentle purr bobbing */
    .fat-head {
      transform-origin: 152px 76px;
      animation: fatHeadTilt 4s ease-in-out infinite;
    }
    @keyframes fatHeadTilt {
      0%, 100% { transform: rotate(0deg) translateY(0px); }
      35% { transform: rotate(-2.5deg) translateY(-1.5px); }
      70% { transform: rotate(2deg) translateY(0.5px); }
    }

    /* Sleepy / Happy Purr Blink */
    .eye-blink {
      transform-origin: 152px 72px;
      animation: catEyeBlink 4.6s infinite;
    }
    @keyframes catEyeBlink {
      0%, 92%, 97%, 100% { transform: scaleY(1); opacity: 1; }
      95% { transform: scaleY(0.08); opacity: 0.2; }
    }

    /* Ears Twitch */
    .ear-l {
      transform-origin: 122px 42px;
      animation: earTwitchL 5.2s infinite;
    }
    @keyframes earTwitchL {
      0%, 85%, 100% { transform: rotate(0deg); }
      88% { transform: rotate(-7deg); }
      92% { transform: rotate(4deg); }
      96% { transform: rotate(0deg); }
    }
    .ear-r {
      transform-origin: 182px 42px;
      animation: earTwitchR 6.2s infinite 1s;
    }
    @keyframes earTwitchR {
      0%, 85%, 100% { transform: rotate(0deg); }
      88% { transform: rotate(7deg); }
      92% { transform: rotate(-4deg); }
      96% { transform: rotate(0deg); }
    }

    /* Extra Fluffy Fat Tail Sway */
    .fat-tail {
      transform-origin: 275px 108px;
      animation: fatTailSway 3s ease-in-out infinite alternate;
    }
    @keyframes fatTailSway {
      0% { transform: rotate(-14deg); }
      50% { transform: rotate(6deg); }
      100% { transform: rotate(20deg); }
    }

    /* Floating Purr Hearts */
    .purr-1 { animation: floatPurr1 3.4s ease-in-out infinite; }
    .purr-2 { animation: floatPurr2 4s ease-in-out infinite 1.5s; }
    @keyframes floatPurr1 {
      0% { transform: translate(220px, 42px) scale(0.5); opacity: 0; }
      40% { opacity: 0.9; transform: translate(228px, 26px) scale(1.05); }
      100% { transform: translate(234px, 8px) scale(0.7); opacity: 0; }
    }
    @keyframes floatPurr2 {
      0% { transform: translate(85px, 50px) scale(0.4); opacity: 0; }
      40% { opacity: 0.85; transform: translate(78px, 34px) scale(0.95); }
      100% { transform: translate(70px, 18px) scale(0.6); opacity: 0; }
    }

    /* Paws gentle soft kneading */
    .paw-l { animation: pawKneadL 2.4s ease-in-out infinite alternate; }
    .paw-r { animation: pawKneadR 2.4s ease-in-out infinite alternate 1.2s; }
    @keyframes pawKneadL {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2.5px); }
    }
    @keyframes pawKneadR {
      0%, 100% { transform: translateY(-2px); }
      50% { transform: translateY(0.5px); }
    }
  </style>

  <!-- Ground Ambient Shadow & Glow -->
  <ellipse cx="190" cy="142" rx="108" ry="15" fill="url(#catGlowGround)" />
  <ellipse cx="185" cy="140" rx="92" ry="9" fill="#1C0512" opacity="0.45" />

  <!-- Floating Gentle Purr Hearts (Lighter Soft Pink) -->
  <g class="purr-1" fill="#FF80B5">
    <path d="M 0 3 C 0 0, -4 -2, -6 1 C -8 -2, -12 0, -12 3 C -12 7, -6 11, -6 11 C -6 11, 0 7, 0 3 Z" />
    <animateTransform attributeName="transform" type="translate" values="220,42; 228,26; 234,8" dur="3.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.9;0" dur="3.4s" repeatCount="indefinite" />
  </g>
  <g class="purr-2" fill="#FFA6CC">
    <path d="M 0 2.5 C 0 0, -3 -1.5, -5 1 C -7 -1.5, -10 0, -10 2.5 C -10 6, -5 9, -5 9 C -5 9, 0 6, 0 2.5 Z" />
    <animateTransform attributeName="transform" type="translate" values="85,50; 78,34; 70,18" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.85;0" dur="4s" repeatCount="indefinite" />
  </g>

  <!-- Animated Extra Fat Cat Body -->
  <g class="fat-breathe">
    <animateTransform attributeName="transform" type="scale" values="1 1; 1.045 0.96; 1 1" dur="3.2s" repeatCount="indefinite" />

    <!-- Extra Chubby Fluffy Tail (Swishing from behind) -->
    <g class="fat-tail">
      <path d="M 275 108 C 308 102, 338 84, 330 58 C 324 40, 300 46, 304 62 C 308 76, 286 90, 264 98 Z" 
            fill="url(#chonkBodyLight)" stroke="#E04692" stroke-width="1.2" />
      <path d="M 302 60 C 316 52, 326 64, 320 74" stroke="#FFE4F0" stroke-width="3" stroke-linecap="round" opacity="0.6" />
      <animateTransform attributeName="transform" type="rotate" values="-14 275 108; 6 275 108; 20 275 108; -14 275 108" dur="3s" repeatCount="indefinite" />
    </g>

    <!-- Super Fat Plump Loaf Belly (Extra Chunky & Round) -->
    <!-- Back rounded hip -->
    <ellipse cx="235" cy="106" rx="68" ry="38" fill="url(#chonkBodyLight)" />
    <!-- Center big tummy -->
    <ellipse cx="180" cy="110" rx="76" ry="36" fill="url(#chonkBodyLight)" />
    <!-- Chest / front -->
    <ellipse cx="140" cy="102" rx="48" ry="32" fill="url(#chonkBodyLight)" />

    <!-- Soft Lighter Fur Shading & Highlights -->
    <path d="M 110 108 C 138 132, 230 134, 275 114 C 292 104, 290 92, 272 82 C 238 66, 150 66, 116 88 Z" 
          fill="url(#chonkBodyLight)" />
    <path d="M 132 74 C 172 62, 238 64, 274 82" stroke="#FFF0F6" stroke-width="4" stroke-linecap="round" opacity="0.55" />
    <path d="M 145 80 C 182 70, 230 72, 258 86" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.75" />

    <!-- Extra Round Chubby Head -->
    <g class="fat-head">
      <animateTransform attributeName="transform" type="rotate" values="0 152 76; -2.5 152 76; 2 152 76; 0 152 76" dur="4s" repeatCount="indefinite" />

      <!-- Left Ear (Softly rounded tip with fluffy inner tufts) -->
      <g class="ear-l">
        <path d="M 115 60 C 110 42, 118 26, 128 22 C 140 20, 148 38, 145 54 Z" fill="url(#chonkHeadLight)" stroke="#D93B88" stroke-width="1.2" />
        <path d="M 120 54 C 117 40, 122 30, 130 28 C 138 26, 142 38, 140 50 Z" fill="url(#earInnerLight)" />
        <path d="M 126 42 Q 133 44 130 49 M 128 36 Q 136 40 134 46" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" />
        <animateTransform attributeName="transform" type="rotate" values="0 122 42; 0 122 42; -7 122 42; 4 122 42; 0 122 42" keyTimes="0;0.85;0.89;0.93;1" dur="5.2s" repeatCount="indefinite" />
      </g>

      <!-- Right Ear -->
      <g class="ear-r">
        <path d="M 162 52 C 162 36, 172 20, 184 22 C 195 26, 198 42, 190 60 Z" fill="url(#chonkHeadLight)" stroke="#D93B88" stroke-width="1.2" />
        <path d="M 166 48 C 166 36, 174 26, 182 28 C 190 30, 192 42, 186 54 Z" fill="url(#earInnerLight)" />
        <path d="M 175 42 Q 170 44 172 49 M 178 36 Q 171 40 173 46" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" />
        <animateTransform attributeName="transform" type="rotate" values="0 182 42; 0 182 42; 7 182 42; -4 182 42; 0 182 42" keyTimes="0;0.85;0.89;0.93;1" dur="6.2s" repeatCount="indefinite" />
      </g>

      <!-- Main Extra Round Head Structure -->
      <ellipse cx="152" cy="72" rx="38" ry="30" fill="url(#chonkHeadLight)" />
      
      <!-- Extra Fat Squishy Cheeks -->
      <ellipse cx="125" cy="80" rx="19" ry="16" fill="url(#chonkHeadLight)" />
      <ellipse cx="178" cy="80" rx="19" ry="16" fill="url(#chonkHeadLight)" />
      <!-- Soft Rosy Blush -->
      <circle cx="128" cy="80" r="16" fill="url(#cheekBlush)" />
      <circle cx="175" cy="80" r="16" fill="url(#cheekBlush)" />

      <!-- Forehead Soft Highlights -->
      <path d="M 134 48 C 146 44, 160 44, 172 48" stroke="#FFE0EF" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
      <path d="M 142 52 C 148 49, 158 49, 164 52" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

      <!-- Big Glossy Jewel Eyes -->
      <g class="eye-blink">
        <!-- Left Eye -->
        <ellipse cx="134" cy="68" rx="9.5" ry="8.5" fill="#420623" />
        <ellipse cx="134" cy="68" rx="8" ry="7.2" fill="url(#eyeIrisLight)" />
        <ellipse cx="134" cy="68" rx="4.2" ry="5.8" fill="#1C010E" />
        <circle cx="131.5" cy="65.5" r="2.8" fill="#FFFFFF" />
        <circle cx="136.8" cy="70.5" r="1.3" fill="#FFFFFF" opacity="0.85" />
        <path d="M 125 61 C 130 58, 139 58, 143 61" stroke="#8A154E" stroke-width="1.8" stroke-linecap="round" />

        <!-- Right Eye -->
        <ellipse cx="170" cy="68" rx="9.5" ry="8.5" fill="#420623" />
        <ellipse cx="170" cy="68" rx="8" ry="7.2" fill="url(#eyeIrisLight)" />
        <ellipse cx="170" cy="68" rx="4.2" ry="5.8" fill="#1C010E" />
        <circle cx="167.5" cy="65.5" r="2.8" fill="#FFFFFF" />
        <circle cx="172.8" cy="70.5" r="1.3" fill="#FFFFFF" opacity="0.85" />
        <path d="M 161 61 C 166 58, 175 58, 179 61" stroke="#8A154E" stroke-width="1.8" stroke-linecap="round" />

        <animateTransform attributeName="transform" type="scale" values="1 1; 1 1; 1 0.08; 1 1; 1 1" keyTimes="0;0.92;0.95;0.98;1" dur="4.6s" repeatCount="indefinite" />
      </g>

      <!-- Cute Tiny Button Nose (Sweet Pink) -->
      <path d="M 149 74 C 150 73, 154 73, 155 74 C 156 76, 153 79, 152 79 C 151 79, 148 76, 149 74 Z" fill="#FF80B5" />

      <!-- Cute Smiling Cat Muzzle -->
      <path d="M 146 79 Q 152 83 152 80 Q 152 83 158 79" stroke="#7A1043" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <path d="M 148 83 Q 152 86 156 83" stroke="#FFA6CC" stroke-width="1.4" stroke-linecap="round" opacity="0.75" />

      <!-- Soft Whiskers -->
      <g>
        <path d="M 128 76 C 112 74, 96 76, 84 82" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.85" />
        <path d="M 128 79 C 110 80, 94 85, 82 93" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.85" />
        <path d="M 128 82 C 114 86, 102 94, 92 103" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round" opacity="0.7" />

        <path d="M 175 76 C 191 74, 207 76, 219 82" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.85" />
        <path d="M 175 79 C 193 80, 209 85, 221 93" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.85" />
        <path d="M 175 82 C 189 86, 201 94, 211 103" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round" opacity="0.7" />
      </g>
    </g>

    <!-- Extra Pudgy Paws (Plump Marshmallow Pads with Soft Toe Lines) -->
    <g class="paw-l">
      <ellipse cx="128" cy="116" rx="14" ry="9" fill="url(#pawLight)" stroke="#D93B88" stroke-width="1.2" />
      <path d="M 121 113 C 121 118, 126 122, 130 122" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity="0.65" />
      <line x1="125" y1="113" x2="125" y2="121" stroke="#8A154E" stroke-width="1.2" stroke-linecap="round" />
      <line x1="131" y1="113" x2="131" y2="121" stroke="#8A154E" stroke-width="1.2" stroke-linecap="round" />
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2.5; 0,0" dur="2.4s" repeatCount="indefinite" />
    </g>

    <g class="paw-r">
      <ellipse cx="164" cy="116" rx="14" ry="9" fill="url(#pawLight)" stroke="#D93B88" stroke-width="1.2" />
      <path d="M 157 113 C 157 118, 162 122, 166 122" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity="0.65" />
      <line x1="161" y1="113" x2="161" y2="121" stroke="#8A154E" stroke-width="1.2" stroke-linecap="round" />
      <line x1="167" y1="113" x2="167" y2="121" stroke="#8A154E" stroke-width="1.2" stroke-linecap="round" />
      <animateTransform attributeName="transform" type="translate" values="0,-2; 0,0.5; 0,-2" dur="2.4s" repeatCount="indefinite" />
    </g>

  </g>
</svg>