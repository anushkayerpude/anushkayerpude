<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 160" width="280" height="118" fill="none">
  <defs>
    <!-- Soft velvety magenta gradients (not harsh neon) -->
    <radialGradient id="bodyShade" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#D84E8F" />
      <stop offset="45%" stop-color="#A82868" />
      <stop offset="85%" stop-color="#68123C" />
      <stop offset="100%" stop-color="#400A24" />
    </radialGradient>

    <radialGradient id="headShade" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#E25C9A" />
      <stop offset="50%" stop-color="#B02E70" />
      <stop offset="88%" stop-color="#721443" />
      <stop offset="100%" stop-color="#4A0C2A" />
    </radialGradient>

    <radialGradient id="cheekShade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5A0C8" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#E05B9A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#B02E70" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="earInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7BED8" />
      <stop offset="100%" stop-color="#D85A94" />
    </linearGradient>

    <linearGradient id="pawShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5AECF" />
      <stop offset="60%" stop-color="#C83E7D" />
      <stop offset="100%" stop-color="#7C1448" />
    </linearGradient>

    <radialGradient id="eyeIris" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFD6EA" />
      <stop offset="40%" stop-color="#E85D9E" />
      <stop offset="80%" stop-color="#9C1858" />
      <stop offset="100%" stop-color="#4D0628" />
    </radialGradient>

    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#30051B" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#200412" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#12020A" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle soft shadow filter -->
    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" />
    </filter>
  </defs>

  <style>
    /* Breathing Chonky Belly & Body */
    .chonk-breathe {
      transform-origin: 190px 125px;
      animation: chonkBreathe 3.4s ease-in-out infinite alternate;
    }
    @keyframes chonkBreathe {
      0% { transform: scale(1, 1) translateY(0px); }
      100% { transform: scale(1.035, 0.97) translateY(1.5px); }
    }

    /* Head Motion (Cute gentle bob & purr) */
    .chonk-head {
      transform-origin: 155px 78px;
      animation: chonkHead 4.2s ease-in-out infinite;
    }
    @keyframes chonkHead {
      0%, 100% { transform: rotate(0deg) translateY(0px); }
      35% { transform: rotate(-2.5deg) translateY(-1px); }
      70% { transform: rotate(2deg) translateY(0.5px); }
    }

    /* Soft Realistic Eye Blink */
    .eye-blink {
      transform-origin: 155px 74px;
      animation: catEyeBlink 4.8s infinite;
    }
    @keyframes catEyeBlink {
      0%, 93%, 97%, 100% { transform: scaleY(1); opacity: 1; }
      95% { transform: scaleY(0.08); opacity: 0.2; }
    }

    /* Ears gentle micro-twitch */
    .ear-left {
      transform-origin: 130px 45px;
      animation: earTwitchL 5.5s infinite;
    }
    @keyframes earTwitchL {
      0%, 86%, 100% { transform: rotate(0deg); }
      89% { transform: rotate(-6deg); }
      93% { transform: rotate(3deg); }
      96% { transform: rotate(0deg); }
    }
    .ear-right {
      transform-origin: 180px 45px;
      animation: earTwitchR 6.5s infinite 1.2s;
    }
    @keyframes earTwitchR {
      0%, 86%, 100% { transform: rotate(0deg); }
      89% { transform: rotate(6deg); }
      93% { transform: rotate(-3deg); }
      96% { transform: rotate(0deg); }
    }

    /* Chubby Fluffy Tail Sway */
    .chonk-tail {
      transform-origin: 265px 105px;
      animation: tailSway 3.2s ease-in-out infinite alternate;
    }
    @keyframes tailSway {
      0% { transform: rotate(-12deg); }
      50% { transform: rotate(4deg); }
      100% { transform: rotate(18deg); }
    }

    /* Whiskers Twitch */
    .whiskers {
      animation: whiskerTwitch 4s ease-in-out infinite;
    }
    @keyframes whiskerTwitch {
      0%, 88%, 100% { transform: rotate(0deg); }
      91% { transform: rotate(1.5deg); }
      94% { transform: rotate(-1deg); }
    }

    /* Soft floating purr hearts */
    .purr-heart-1 {
      animation: floatPurr1 3.5s ease-in-out infinite;
    }
    .purr-heart-2 {
      animation: floatPurr2 4s ease-in-out infinite 1.6s;
    }
    @keyframes floatPurr1 {
      0% { transform: translate(215px, 45px) scale(0.5); opacity: 0; }
      40% { opacity: 0.85; transform: translate(222px, 30px) scale(1); }
      100% { transform: translate(228px, 12px) scale(0.7); opacity: 0; }
    }
    @keyframes floatPurr2 {
      0% { transform: translate(95px, 55px) scale(0.4); opacity: 0; }
      40% { opacity: 0.75; transform: translate(88px, 40px) scale(0.9); }
      100% { transform: translate(80px, 24px) scale(0.6); opacity: 0; }
    }

    /* Paws subtle soft kneading */
    .paw-l {
      animation: pawKneadL 2.6s ease-in-out infinite alternate;
    }
    .paw-r {
      animation: pawKneadR 2.6s ease-in-out infinite alternate 1.3s;
    }
    @keyframes pawKneadL {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2px); }
    }
    @keyframes pawKneadR {
      0%, 100% { transform: translateY(-1.5px); }
      50% { transform: translateY(0.5px); }
    }
  </style>

  <!-- Ground Shadow under chubby belly -->
  <ellipse cx="190" cy="138" rx="100" ry="14" fill="url(#groundShadow)" />
  <ellipse cx="185" cy="136" rx="85" ry="9" fill="#250414" opacity="0.6" />

  <!-- Floating Gentle Purr Hearts (Soft dusty rose) -->
  <g class="purr-heart-1" fill="#E868A2">
    <path d="M 0 3 C 0 0, -4 -2, -6 1 C -8 -2, -12 0, -12 3 C -12 7, -6 11, -6 11 C -6 11, 0 7, 0 3 Z" />
    <animateTransform attributeName="transform" type="translate" values="215,45; 222,30; 228,12" dur="3.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.85;0" dur="3.5s" repeatCount="indefinite" />
  </g>
  <g class="purr-heart-2" fill="#F49ECA">
    <path d="M 0 2.5 C 0 0, -3 -1.5, -5 1 C -7 -1.5, -10 0, -10 2.5 C -10 6, -5 9, -5 9 C -5 9, 0 6, 0 2.5 Z" />
    <animateTransform attributeName="transform" type="translate" values="95,55; 88,40; 80,24" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.75;0" dur="4s" repeatCount="indefinite" />
  </g>

  <!-- Animated Cat Group -->
  <g class="chonk-breathe">
    <animateTransform attributeName="transform" type="scale" values="1 1; 1.035 0.97; 1 1" dur="3.4s" repeatCount="indefinite" />

    <!-- Chubby Fluffy Tail (Swishing gently from behind body) -->
    <g class="chonk-tail">
      <path d="M 265 105 C 295 100, 325 82, 318 58 C 312 42, 290 48, 294 62 C 298 74, 276 88, 255 96 Z" 
            fill="url(#bodyShade)" stroke="#8C1C52" stroke-width="1" />
      <path d="M 292 60 C 305 52, 314 62, 308 72" stroke="#E870A8" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
      <animateTransform attributeName="transform" type="rotate" values="-12 265 105; 4 265 105; 18 265 105; -12 265 105" dur="3.2s" repeatCount="indefinite" />
    </g>

    <!-- Super Chubby Loaf Body (Round, plump, cuddly) -->
    <!-- Back / Hindquarters -->
    <ellipse cx="225" cy="104" rx="60" ry="34" fill="url(#bodyShade)" />
    <!-- Main Belly & Torso -->
    <ellipse cx="180" cy="108" rx="68" ry="32" fill="url(#bodyShade)" />
    <!-- Chest & Forebody -->
    <ellipse cx="145" cy="100" rx="42" ry="28" fill="url(#bodyShade)" />

    <!-- Soft Velvet Shading & Highlights on Fur -->
    <path d="M 120 106 C 145 125, 220 128, 260 110 C 275 102, 275 92, 260 84 C 230 70, 155 70, 125 90 Z" 
          fill="url(#bodyShade)" />
    <path d="M 140 76 C 175 66, 230 68, 260 85" stroke="#F08ABF" stroke-width="3" stroke-linecap="round" opacity="0.35" />
    <path d="M 150 82 C 180 74, 220 76, 245 88" stroke="#FAD0E6" stroke-width="1.5" stroke-linecap="round" opacity="0.45" />

    <!-- Cat Head (Round, chubby cheeks like British Shorthair) -->
    <g class="chonk-head">
      <animateTransform attributeName="transform" type="rotate" values="0 155 78; -2.5 155 78; 2 155 78; 0 155 78" dur="4.2s" repeatCount="indefinite" />

      <!-- Left Ear (Softly rounded tip with realistic tufts) -->
      <g class="ear-left">
        <path d="M 122 62 C 118 45, 124 30, 134 26 C 144 24, 152 40, 150 56 Z" fill="url(#headShade)" stroke="#721443" stroke-width="1" />
        <path d="M 127 56 C 124 44, 128 34, 135 32 C 142 30, 146 42, 144 52 Z" fill="url(#earInner)" />
        <!-- Ear fluff tufts -->
        <path d="M 132 44 Q 138 46 136 50 M 134 38 Q 141 42 139 48" stroke="#FDEBF4" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
        <animateTransform attributeName="transform" type="rotate" values="0 130 45; 0 130 45; -6 130 45; 3 130 45; 0 130 45" keyTimes="0;0.86;0.9;0.94;1" dur="5.5s" repeatCount="indefinite" />
      </g>

      <!-- Right Ear -->
      <g class="ear-right">
        <path d="M 166 54 C 166 38, 175 24, 185 26 C 195 30, 198 45, 192 62 Z" fill="url(#headShade)" stroke="#721443" stroke-width="1" />
        <path d="M 170 50 C 170 40, 176 30, 183 32 C 190 34, 192 44, 187 56 Z" fill="url(#earInner)" />
        <!-- Ear fluff tufts -->
        <path d="M 178 44 Q 174 46 176 50 M 181 38 Q 175 42 177 48" stroke="#FDEBF4" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
        <animateTransform attributeName="transform" type="rotate" values="0 180 45; 0 180 45; 6 180 45; -3 180 45; 0 180 45" keyTimes="0;0.86;0.9;0.94;1" dur="6.5s" repeatCount="indefinite" />
      </g>

      <!-- Main Round Head Structure -->
      <ellipse cx="156" cy="74" rx="34" ry="28" fill="url(#headShade)" />
      
      <!-- Chubby Cheeks / Muzzle pads (Round and squishy) -->
      <ellipse cx="132" cy="82" rx="16" ry="14" fill="url(#headShade)" />
      <ellipse cx="180" cy="82" rx="16" ry="14" fill="url(#headShade)" />
      <!-- Soft Rosy Cheek Glow -->
      <circle cx="134" cy="82" r="14" fill="url(#cheekShade)" />
      <circle cx="178" cy="82" r="14" fill="url(#cheekShade)" />

      <!-- Forehead Soft Fur Highlights -->
      <path d="M 140 52 C 150 48, 162 48, 172 52" stroke="#F4A2CB" stroke-width="2" stroke-linecap="round" opacity="0.4" />
      <path d="M 146 56 C 152 53, 160 53, 166 56" stroke="#FCE7F3" stroke-width="1.2" stroke-linecap="round" opacity="0.5" />

      <!-- Big Cute Realistic Eyes -->
      <g class="eye-blink">
        <!-- Left Eye Background & Iris -->
        <ellipse cx="139" cy="70" rx="9" ry="8" fill="#38061C" />
        <ellipse cx="139" cy="70" rx="7.5" ry="6.8" fill="url(#eyeIris)" />
        <!-- Pupil -->
        <ellipse cx="139" cy="70" rx="4.2" ry="5.5" fill="#18010C" />
        <!-- Glassy Specular Highlights -->
        <circle cx="136.5" cy="67.5" r="2.4" fill="#FFFFFF" />
        <circle cx="141.5" cy="72" r="1.1" fill="#FFFFFF" opacity="0.8" />
        <path d="M 131 63 C 135 60, 143 60, 147 63" stroke="#540C30" stroke-width="1.5" stroke-linecap="round" />

        <!-- Right Eye Background & Iris -->
        <ellipse cx="173" cy="70" rx="9" ry="8" fill="#38061C" />
        <ellipse cx="173" cy="70" rx="7.5" ry="6.8" fill="url(#eyeIris)" />
        <!-- Pupil -->
        <ellipse cx="173" cy="70" rx="4.2" ry="5.5" fill="#18010C" />
        <!-- Glassy Specular Highlights -->
        <circle cx="170.5" cy="67.5" r="2.4" fill="#FFFFFF" />
        <circle cx="175.5" cy="72" r="1.1" fill="#FFFFFF" opacity="0.8" />
        <path d="M 165 63 C 169 60, 177 60, 181 63" stroke="#540C30" stroke-width="1.5" stroke-linecap="round" />

        <animateTransform attributeName="transform" type="scale" values="1 1; 1 1; 1 0.08; 1 1; 1 1" keyTimes="0;0.92;0.95;0.98;1" dur="4.8s" repeatCount="indefinite" />
      </g>

      <!-- Cute Little Button Nose (Soft dusty rose) -->
      <path d="M 153 76 C 154 75, 158 75, 159 76 C 160 78, 157 81, 156 81 C 155 81, 152 78, 153 76 Z" fill="#E86E9F" />

      <!-- Cute Cat Muzzle Mouth (Gentle happy smile) -->
      <path d="M 151 81 Q 156 84 156 81 Q 156 84 161 81" stroke="#520B2D" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <!-- Soft Chin curve -->
      <path d="M 153 85 Q 156 87 159 85" stroke="#F4A6CC" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />

      <!-- Realistic Soft Whisker Lines (Twitching gently) -->
      <g class="whiskers">
        <!-- Left Whiskers -->
        <path d="M 134 78 C 118 76, 102 78, 92 84" stroke="#FDEAF3" stroke-width="0.9" stroke-linecap="round" opacity="0.75" />
        <path d="M 134 81 C 116 82, 100 87, 90 95" stroke="#FDEAF3" stroke-width="0.9" stroke-linecap="round" opacity="0.75" />
        <path d="M 134 84 C 120 88, 108 96, 100 105" stroke="#FDEAF3" stroke-width="0.8" stroke-linecap="round" opacity="0.6" />
        <!-- Right Whiskers -->
        <path d="M 178 78 C 194 76, 210 78, 220 84" stroke="#FDEAF3" stroke-width="0.9" stroke-linecap="round" opacity="0.75" />
        <path d="M 178 81 C 196 82, 212 87, 222 95" stroke="#FDEAF3" stroke-width="0.9" stroke-linecap="round" opacity="0.75" />
        <path d="M 178 84 C 192 88, 204 96, 212 105" stroke="#FDEAF3" stroke-width="0.8" stroke-linecap="round" opacity="0.6" />
      </g>
    </g>

    <!-- Chubby Paws (Tucked neatly in front, soft plush marshmallow pads) -->
    <g class="paw-l">
      <!-- Left Paw -->
      <ellipse cx="136" cy="116" rx="12" ry="8" fill="url(#pawShade)" stroke="#741243" stroke-width="1" />
      <path d="M 130 114 C 130 118, 134 121, 137 121" stroke="#FCE7F3" stroke-width="1" stroke-linecap="round" opacity="0.5" />
      <line x1="133" y1="114" x2="133" y2="120" stroke="#5A0E34" stroke-width="1.1" stroke-linecap="round" />
      <line x1="138" y1="114" x2="138" y2="120" stroke="#5A0E34" stroke-width="1.1" stroke-linecap="round" />
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2; 0,0" dur="2.6s" repeatCount="indefinite" />
    </g>

    <g class="paw-r">
      <!-- Right Paw -->
      <ellipse cx="168" cy="116" rx="12" ry="8" fill="url(#pawShade)" stroke="#741243" stroke-width="1" />
      <path d="M 162 114 C 162 118, 166 121, 169 121" stroke="#FCE7F3" stroke-width="1" stroke-linecap="round" opacity="0.5" />
      <line x1="165" y1="114" x2="165" y2="120" stroke="#5A0E34" stroke-width="1.1" stroke-linecap="round" />
      <line x1="170" y1="114" x2="170" y2="120" stroke="#5A0E34" stroke-width="1.1" stroke-linecap="round" />
      <animateTransform attributeName="transform" type="translate" values="0,-1.5; 0,0.5; 0,-1.5" dur="2.6s" repeatCount="indefinite" />
    </g>

  </g>
</svg>